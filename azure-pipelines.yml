# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool: terraform

steps:
- task: TerraformTask@5
  displayName: Terraform Init

  inputs:
    provider: 'azurerm'
    command: 'init'
    backendAzureRmStorageAccountName: 'terraformstate76325'
    backendAzureRmContainerName: 'tfpipeline'
    backendAzureRmKey: 'terraform.tfstate'

- task: TerraformTask@5
  displayName: Terraform Plan

  inputs:
    provider: 'azurerm'
    command: 'plan'
    environmentServiceNameAzureRM: 'devops-tf'

- task: TerraformTask@5
  displayName: Terraform Deploy
  inputs:
    provider: 'azurerm'
    command: 'apply'
    commandOptions: '--auto-approve'
    environmentServiceNameAzureRM: 'devops-tf'