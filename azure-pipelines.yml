
trigger:
  branches:
    include:
      - main

parameters:
  - name: environment
    displayName: Terraform environment
    type: string
    default: dev
    values:
      - dev
      - uat
      - prod

pool:
  name: terraform

variables:
  terraformRoot: '$(Build.SourcesDirectory)/terraform'

steps:
  - checkout: self

  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: azurerm
      command: init
      workingDirectory: '$(terraformRoot)/environments/${{ parameters.environment }}'
      backendServiceArm: 'devops-tf'
      backendAzureRmStorageAccountName: 'terraformstate76325'
      backendAzureRmContainerName: 'tfpipeline'
      backendAzureRmKey: '${{ parameters.environment }}.tfstate'
      backendAzureRmResourceGroupName: '<YOUR_STATE_RESOURCE_GROUP>'

  - task: TerraformTask@5
    displayName: Terraform Plan
    inputs:
      provider: azurerm
      command: plan
      workingDirectory: '$(terraformRoot)/environments/${{ parameters.environment }}'
      environmentServiceNameAzureRM: 'devops-tf'

  # Apply intentionally omitted during initial validation.
